name: Bug report
description: Report a reproducible problem in the local pipeline.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, private transcripts, raw provider logs, and generated media before posting.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and repository commit.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command that failed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Safe, minimal steps and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Include relevant output after removing secrets and private data.
