name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --upgrade pip-audit
      - name: Audit runtime and alignment dependencies
        run: pip-audit -r requirements.txt -r requirements-alignment.txt --progress-spinner off
